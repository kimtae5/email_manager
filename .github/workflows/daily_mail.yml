name: Daily Email Agent Summary

on:
  schedule:
    # UTC 22:00 = 한국시간 다음날 07:00
    - cron: '0 22 * * *'

  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Environment
        run: |
          echo "======================================"
          echo "GitHub Actions Environment"
          echo "======================================"
          python --version
          python -c "import ssl; print('OpenSSL:', ssl.OPENSSL_VERSION)"
          python -c "import imaplib; print('imaplib: OK')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Mail Agent Script
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PW: ${{ secrets.NAVER_PW }}

          NATE_USER: ${{ secrets.NATE_USER }}
          NATE_PW: ${{ secrets.NATE_PW }}

          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PW: ${{ secrets.GMAIL_PW }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -u main.py
